<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지 내부 링크</title>
    <!-- 스타일을 지정하는 방법
        1. 인라인
        2. 내부
        3. 외부 -> 프로젝트
    -->
    <style>
        section {height: 100vh; background: orange;}
        /* 
            ~of-type은 타입(태그)을 구분한다.

            section:nth-of-type(1): 섹션의 첫 번째 요소
            section:nth-of-type(2): 섹션의 두 번째 요소
            section:nth-of-type(3): 섹션의 세 번째 요소

            ~child는 타입을 구분하지 않는다.
            section:nth-child(1): body의 첫 번째 섹션 요소
            section:nth-child(2): body의 두 번째 섹션 요소
            section:nth-child(3): body의 세 번째 섹션 요소
        */
        section:nth-child(1) {background: lightblue;}
        section:nth-child(2) {background: lightgreen;}
        section:nth-child(3) {background: lightcoral;}
        footer {height: 100px; background: #111;}
    </style>
</head>
<body>
    <!-- body의 첫 번째 자식은 헤더 -->
    <header style="height:95px; background: #ccc;">헤더</header>
    <!-- body의 두 번째 자식은 헤더 -->
    <section>비디오</section>
    <!-- body의 세 번째 자식은 헤더 -->
    <section>탭</section>
    <section>패럴렉스 스크롤링</section>
    <footer>푸터</footer>
</body>
</html>
